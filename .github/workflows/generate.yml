name: Daily article generation

# 🔧 復旧版 (recover/low-frequency-post branch)
# 投稿頻度を 3/日 → 2/日 に減らしたため生成も 2/日 → 1/日 に戻す。
# 生成: 2記事/run × 2lang = 4ファイル/日
# 消費: 2記事/日/lang/PF × 2lang = 4ファイル/日/PF
# → 収支 ±0、在庫は現在の ~35 ペアを長期キープ
on:
  schedule:
    - cron: '37 21 * * *'   # 06:37 JST (毎時 0 分を避けて Bot 臭さ軽減)
  workflow_dispatch:

permissions:
  contents: write   # 生成された .md を main に push するため

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # resvg-js Linux binary が同梱の可変フォント (or 変換した静的 fontools 出力)
      # をうまく扱えず日本語グリフが豆腐化するため、システムに Noto CJK JP を
      # インストールしておき、render-card.ts 側で loadSystemFonts:true で
      # fallback として拾えるようにする。
      - name: Install Japanese fonts (Noto CJK JP) for OG image rendering
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run pipeline:daily (PubMed → Claude → MD × 2 categories)
        run: npm run pipeline:daily -- --category=all
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-5
          PUBMED_TOOL: pubmed-trivia
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
          SITE_URL: https://sciencepubmed.net
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}

      - name: Generate OG images (1200x630) for new articles
        run: npm run generate:og

      - name: Generate Instagram square (1080x1080) for new articles
        run: npm run generate:og -- --size=square

      - name: Commit + push (articles + images)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/ public/og/ public/square/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "auto: daily generation $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push
