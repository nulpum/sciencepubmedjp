name: Scheduled SNS posting

# 🚨 2026-05-18: Meta 開発者アカウント保留中のため schedule を一時停止
#   Meta が「不審アクティビティ」検知で App をブロック → 3PF 全 token 死亡
#   失敗 cron を繰り返すと Meta の spam スコアがさらに悪化するため一時停止
#   復旧後 (token 再発行 + App 再有効化) に cron を再有効化する
#
# 通常時の cron (復旧後コピペで戻す):
#   - cron: '0 22 * * *'   # 07:00 JST
#   - cron: '0 3 * * *'    # 12:00 JST
#   - cron: '0 12 * * *'   # 21:00 JST
on:
  # schedule: 一時停止中
  workflow_dispatch:

permissions:
  contents: write   # data/posted.json を main に push するため

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # === 日本語 (ja) ===
      - name: Post to Threads (ja)
        # 1 step 失敗してもジョブ全体は止めず、他も試す
        continue-on-error: true
        run: npm run post:threads -- --lang=ja --strategy=oldest
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: me
          SITE_URL: https://sciencepubmed.net

      - name: Post to Facebook (ja)
        continue-on-error: true
        run: npm run post:facebook -- --lang=ja --strategy=oldest
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net

      - name: Post to Instagram (ja)
        continue-on-error: true
        run: npm run post:instagram -- --lang=ja --strategy=oldest
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net

      # === 英語 (en) === 海外フォロワー向け
      - name: Post to Threads (en)
        continue-on-error: true
        run: npm run post:threads -- --lang=en --strategy=oldest
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: me
          SITE_URL: https://sciencepubmed.net

      - name: Post to Facebook (en)
        continue-on-error: true
        run: npm run post:facebook -- --lang=en --strategy=oldest
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net

      - name: Post to Instagram (en)
        continue-on-error: true
        run: npm run post:instagram -- --lang=en --strategy=oldest
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net

      - name: Send X-version template to Gmail
        # 最新投稿を X 用に整形して自分の Gmail に送信 (手動 X コピペ用)
        # --lang=ja で固定: X は日本語アカウント運用想定 (en 直近投稿を拾わない)
        continue-on-error: true
        run: npm run notify:x -- --lang=ja
        env:
          SITE_URL: https://sciencepubmed.net
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - name: Commit + push posted.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          if git diff --staged --quiet; then
            echo "No post records to commit (both posts may have failed or all articles already posted)"
            exit 0
          fi
          git commit -m "auto: posted record $(date -u +%FT%TZ)"
          git pull --rebase origin main || true
          git push
