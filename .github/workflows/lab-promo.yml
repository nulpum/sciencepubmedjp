name: Lab promo posting (legacy, manual-only)

# ⚠️ 旧: 固定文言の Lab 宣伝を 2 日毎に自動投稿
# ⚠️ 現: 自動 cron 停止 (lab-update / toolkit の 2 系統 recurring に移行済み)
#       manual dispatch のみ残す (何らかの理由で旧コピー流したくなった時用)
#
# 2 日毎ローテーションの現行体制:
#   - lab-update-announcement.yml (1, 5, 9, 13, ...) = 3 大機能 + waitlist
#   - toolkit-announcement.yml    (3, 7, 11, 15, ...) = 自分の AI で無料無制限

on:
  # schedule 停止済み。 再有効化したければ下記のコメント外す。
  # schedule:
  #   - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run で実際には投稿しない (手動実行時のデフォルト true = 安全)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # cron 開始から 0〜10 分の jitter (毎日同時刻ピッタリを避ける)
      - name: Random jitter
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 600))
          echo "sleeping ${DELAY}s for anti-bot jitter"
          sleep "$DELAY"

      - name: Post Lab promo to Threads / Facebook / Instagram
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run promo:lab-post -- --dry-run
          else
            npm run promo:lab-post
          fi
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: me
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net
