name: Lab promo posting

# PubMed Lab の宣伝投稿を Threads / Facebook / Instagram に配信
# 2 日に 1 回、12:00 JST (03:00 UTC)
# 月末境界で 1 日ずれることがあるが許容
on:
  schedule:
    - cron: '0 3 */2 * *'   # 12:00 JST 每2日
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run で実際には投稿しない (手動実行時のデフォルト true = 安全)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # cron 開始から 0〜10 分の jitter (毎日同時刻ピッタリを避ける)
      - name: Random jitter
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 600))
          echo "sleeping ${DELAY}s for anti-bot jitter"
          sleep "$DELAY"

      - name: Post Lab promo to Threads / Facebook / Instagram
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run promo:lab-post -- --dry-run
          else
            npm run promo:lab-post
          fi
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: me
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net
