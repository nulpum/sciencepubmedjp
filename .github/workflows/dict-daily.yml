name: Dict Daily SNS Post

on:
  schedule:
    # 毎日 JST 12:00 (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Specific slug to post (optional)'
        required: false
        type: string
      dry:
        description: 'Dry run'
        required: false
        default: false
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Post to Bluesky + Threads
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SITE_URL: https://sciencepubmed.net
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="$ARGS --slug=${{ inputs.slug }}"
          fi
          if [ "${{ inputs.dry }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          npm run post:dict -- $ARGS
      - name: Commit posted.json
        if: ${{ inputs.dry != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/dict/posted.json; then
            echo "no changes"
          else
            git add data/dict/posted.json
            git commit -m "auto: dict SNS post record $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
