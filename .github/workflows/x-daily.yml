name: Daily X template email

# Meta から独立した X 用テンプレ daily 配信
#
# post.yml が止まっていても (Meta 復旧待ち中でも) X 手動投稿を継続できるよう、
# 毎朝 1 通の X 用テンプレを Gmail に送信する。
# 22:43 UTC = 07:43 JST (毎時 0 分を避けて Bot 臭さ軽減)
on:
  schedule:
    - cron: '43 22 * * *'   # 07:43 JST
  workflow_dispatch:

permissions:
  contents: write   # data/x-emailed.json を main に push するため

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send X-template Gmail
        run: npm run notify:x-daily
        env:
          SITE_URL: https://sciencepubmed.net
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}

      - name: Commit + push x-emailed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-emailed.json
          if git diff --staged --quiet; then
            echo "No new x-emailed record to commit"
            exit 0
          fi
          git commit -m "auto: x-daily email record $(date -u +%FT%TZ)"
          git pull --rebase origin main || true
          git push
