name: Lab UPDATE announcement (recurring + manual)

# PubMed Lab 大型アップデート告知 (3大機能 + waitlist) を
# Threads / Facebook / Instagram に配信する。
#
# 自動: 4 日毎 (1, 5, 9, 13, 17, 21, 25, 29 日) の 12:00 JST に配信
#       → toolkit-announcement.yml (3, 7, 11, ...) と交互 = 2 日毎に 1 投稿ローテ
# 手動: workflow_dispatch で任意タイミング、dry_run=true でプレビュー可
#
# X (Twitter) はこの workflow に含めない (手動投稿でスレッド化)。

on:
  schedule:
    - cron: '0 3 1-31/4 * *'   # 12:00 JST 4日毎 (奇数日側)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true=本文だけログ出力、false=実際に配信'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      skip:
        description: 'スキップするPF (カンマ区切り、例 fb,ig)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  announcement:
    runs-on: ubuntu-latest
    # Instagram の media container 処理が遅延するケースがあるため、余裕を持って 15 分
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # cron 開始から 0〜10 分の jitter (毎日同時刻ピッタリを避ける、Bot 臭さ軽減)
      - name: Random jitter
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 600))
          echo "sleeping ${DELAY}s for anti-bot jitter"
          sleep "$DELAY"

      - name: Post Lab update announcement
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.skip }}" ]; then
            ARGS="$ARGS --skip=${{ inputs.skip }}"
          fi
          echo "Running: npm run promo:lab-update -- $ARGS"
          npm run promo:lab-update -- $ARGS
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: me
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SITE_URL: https://sciencepubmed.net
